[project]
name = "sluchawa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NowakowskiKonrad", email = "kaneoo@pm.me" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "langchain>=1.4.7",
    "loguru>=0.8.0",
    "mypy>=2.4.1",
    "numpy>=2.5.4",
    "py-cord[voice]>=2.8.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "soundcard>=0.4.6",
    "soundfile>=0.14.0",
]

[project.scripts]
sluchawa = "sluchawa:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
]
