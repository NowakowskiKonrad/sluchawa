[project]
name = "sluchawa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NowakowskiKonrad", email = "kaneoo@pm.me" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "loguru>=0.8.0",
    "langchain-groq>=1.1.3",
    "py-cord[voice]>=2.8.1",
    "langchain-core>=1.7.1",
    "mypy>=2.4.1",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
sluchawa = "sluchawa:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
]
